<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="/favicon.ico" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <title>ReBrand AI — Instant Document Rebranding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080C14;
      --surface:   #0E1420;
      --surface2:  #141B28;
      --border:    #1E2A3E;
      --border2:   #253348;
      --accent:    #3B82F6;
      --accent2:   #60A5FA;
      --green:     #10B981;
      --text:      #E8EDF5;
      --muted:     #6B7A99;
      --danger:    #EF4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* ── NAV ─────────────────────────────── */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(8,12,20,0.92);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-dot { color: var(--accent); }

    .nav-badge {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--muted);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* ── MAIN ────────────────────────────── */
    main { max-width: 900px; margin: 0 auto; padding: 60px 24px; }

    /* ── HERO ────────────────────────────── */
    .hero { text-align: center; margin-bottom: 64px; }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.25);
      color: var(--accent2);
      font-size: 11px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(36px, 6vw, 58px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -1.5px;
      margin-bottom: 16px;
    }

    .hero h1 span { color: var(--accent); }

    .hero p {
      color: var(--muted);
      font-size: 16px;
      font-weight: 300;
      max-width: 520px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* ── STEPS BAR ───────────────────────── */
    .steps-bar {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .step-item {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-right: 1px solid var(--border);
      transition: background 0.2s;
    }

    .step-item:last-child { border-right: none; }

    .step-item.active { background: rgba(59,130,246,0.08); }
    .step-item.done   { background: rgba(16,185,129,0.06); }

    .step-num {
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
      flex-shrink: 0;
      transition: all 0.3s;
    }

    .step-item.pending .step-num { background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); }
    .step-item.active  .step-num { background: var(--accent); color: white; }
    .step-item.done    .step-num { background: var(--green); color: white; }

    .step-label { font-size: 12.5px; font-weight: 500; }
    .step-item.pending .step-label { color: var(--muted); }
    .step-item.active  .step-label { color: var(--text); }
    .step-item.done    .step-label { color: var(--green); }

    /* ── CARDS ───────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .card-icon.blue  { background: rgba(59,130,246,0.15); }
    .card-icon.green { background: rgba(16,185,129,0.15); }
    .card-icon.purple{ background: rgba(139,92,246,0.15); }

    .card-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; }
    .card-sub   { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .card-body { padding: 24px; }

    /* ── UPLOAD ZONE ─────────────────────── */
    .upload-zone {
      border: 1.5px dashed var(--border2);
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg);
    }

    .upload-zone:hover,
    .upload-zone.drag { border-color: var(--accent); background: rgba(59,130,246,0.04); }

    .upload-zone.done { border-color: var(--green); border-style: solid; background: rgba(16,185,129,0.04); }

    .upload-icon { font-size: 32px; margin-bottom: 10px; }

    .upload-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .upload-hint  { font-size: 12px; color: var(--muted); }

    .file-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.3);
      color: var(--green);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      margin-top: 12px;
    }

    /* ── BRAND PREVIEW ───────────────────── */
    .brand-preview {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .brand-field {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .brand-field-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .brand-field-value { font-size: 13px; font-weight: 500; }

    .color-swatch {
      display: flex;
      gap: 6px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .swatch {
      width: 32px; height: 32px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      position: relative;
      cursor: default;
    }

    .swatch-label {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── BUTTONS ─────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
    }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { background: #2563EB; }

    .btn-success { background: var(--green); color: white; }
    .btn-success:hover:not(:disabled) { background: #059669; }

    .btn-ghost {
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--border2); }

    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-lg { padding: 15px 32px; font-size: 15px; border-radius: 10px; width: 100%; justify-content: center; }

    /* ── SPINNER ─────────────────────────── */
    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    /* ── LOADING CARD ────────────────────── */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      gap: 16px;
    }

    .loading-spinner-big {
      width: 52px; height: 52px;
      border: 3px solid rgba(59,130,246,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-title  { font-family: 'Syne', sans-serif; font-size: 17px; font-weight: 700; }
    .loading-sub    { font-size: 13px; color: var(--muted); }

    .loading-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 320px;
    }

    .loading-step {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      color: var(--muted);
      transition: color 0.3s;
    }

    .loading-step.active { color: var(--accent2); }
    .loading-step.done   { color: var(--green); }

    .loading-step-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* ── PREVIEW ─────────────────────────── */
    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .preview-info { font-size: 13px; color: var(--muted); }
    .preview-info strong { color: var(--text); }

    .preview-frame {
      width: 100%;
      height: 780px;
      border: none;
      background: white;
      display: block;
    }

    /* ── ERROR ───────────────────────────── */
    .error-box {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      color: #FCA5A5;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 12px;
    }

    /* ── SEPARATOR ───────────────────────── */
    .sep { height: 1px; background: var(--border); margin: 32px 0; }

    /* ── FLOW ────────────────────────────── */
    .flow { display: flex; flex-direction: column; gap: 20px; }

    .action-row {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    /* ── FOOTER ──────────────────────────── */
    footer {
      text-align: center;
      padding: 32px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
      margin-top: 80px;
    }
  </style>
</head>
<body>

<nav>
  <div class="logo">ReBrand<span class="logo-dot">.</span>AI</div>
  <div class="nav-badge">POWERED BY GEMINI</div>
</nav>

<main id="root"></main>

<footer>
  ReBrand AI &nbsp;·&nbsp; Upload any PDF, get it in your brand.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
const { useState, useRef, useCallback } = React;
const e = React.createElement;

// ── Upload Zone component ──────────────────────────────────────────────────────
function UploadZone({ label, hint, onFile, file, disabled }) {
  const [drag, setDrag] = useState(false);
  const ref = useRef();

  const handle = f => {
    if (f && f.type === 'application/pdf') onFile(f);
  };

  return e('div', {
    className: `upload-zone ${drag ? 'drag' : ''} ${file ? 'done' : ''}`,
    onClick: disabled ? null : () => ref.current.click(),
    onDragOver: ev => { ev.preventDefault(); if (!disabled) setDrag(true); },
    onDragLeave: () => setDrag(false),
    onDrop: ev => { ev.preventDefault(); setDrag(false); if (!disabled) handle(ev.dataTransfer.files[0]); },
    style: disabled ? { opacity: 0.5, cursor: 'not-allowed' } : {}
  },
    e('div', { className: 'upload-icon' }, file ? '✅' : '📄'),
    e('div', { className: 'upload-title' }, file ? file.name : label),
    e('div', { className: 'upload-hint' }, file ? 'Click to change' : hint),
    file && e('div', { className: 'file-badge' },
      e('span', null, '✓'),
      `${(file.size / 1024).toFixed(0)} KB`
    ),
    e('input', { ref, type: 'file', accept: '.pdf', style: { display: 'none' },
      onChange: ev => handle(ev.target.files[0]) })
  );
}

// ── Brand Preview ──────────────────────────────────────────────────────────────
function BrandPreview({ brand }) {
  const colors = [
    ['Primary',   brand.primaryColor],
    ['Secondary', brand.secondaryColor],
    ['Accent',    brand.accentColor],
    ['Text',      brand.textColor],
    ['BG',        brand.bgColor],
  ].filter(([,v]) => v);

  return e('div', null,
    e('div', { className: 'brand-preview' },
      e('div', { className: 'brand-field' },
        e('div', { className: 'brand-field-label' }, 'Company'),
        e('div', { className: 'brand-field-value' }, brand.companyName || '—')
      ),
      e('div', { className: 'brand-field' },
        e('div', { className: 'brand-field-label' }, 'Industry'),
        e('div', { className: 'brand-field-value' }, brand.industry || '—')
      ),
      e('div', { className: 'brand-field' },
        e('div', { className: 'brand-field-label' }, 'Style'),
        e('div', { className: 'brand-field-value' }, brand.fontStyle || '—')
      ),
      e('div', { className: 'brand-field' },
        e('div', { className: 'brand-field-label' }, 'Tone'),
        e('div', { className: 'brand-field-value' }, brand.tone || '—')
      ),
    ),
    colors.length > 0 && e('div', null,
      e('div', { style: { fontSize: 10, color: 'var(--muted)', textTransform: 'uppercase', letterSpacing: '0.5px', margin: '18px 0 12px' } }, 'Brand Colors'),
      e('div', { className: 'color-swatch' },
        colors.map(([label, hex]) =>
          e('div', { key: label, style: { position: 'relative', marginBottom: 20 } },
            e('div', { className: 'swatch', style: { background: hex }, title: `${label}: ${hex}` }),
            e('div', { className: 'swatch-label' }, label)
          )
        )
      )
    )
  );
}

// ── Loading State ──────────────────────────────────────────────────────────────
function LoadingView({ steps, currentStep }) {
  return e('div', { className: 'loading-state' },
    e('div', { className: 'loading-spinner-big' }),
    e('div', { className: 'loading-title' }, steps[currentStep]?.label || 'Processing…'),
    e('div', { className: 'loading-sub' }, 'This may take 15–30 seconds'),
    e('div', { className: 'loading-steps' },
      steps.map((s, i) =>
        e('div', {
          key: i,
          className: `loading-step ${i < currentStep ? 'done' : i === currentStep ? 'active' : ''}`
        },
          e('div', { className: 'loading-step-dot' }),
          e('span', null, i < currentStep ? '✓ ' + s.label : s.label)
        )
      )
    )
  );
}

// ── Step Indicator ─────────────────────────────────────────────────────────────
function StepsBar({ current }) {
  const steps = ['Upload Profiles', 'Review & Extract', 'Generated Document'];
  return e('div', { className: 'steps-bar' },
    steps.map((s, i) => {
      const state = i < current ? 'done' : i === current ? 'active' : 'pending';
      return e('div', { key: i, className: `step-item ${state}` },
        e('div', { className: 'step-num' }, state === 'done' ? '✓' : i + 1),
        e('div', { className: 'step-label' }, s)
      );
    })
  );
}

// ── Main App ───────────────────────────────────────────────────────────────────
function App() {
  const [phase, setPhase] = useState('upload');   // upload | loading | result
  const [brandFile, setBrandFile]   = useState(null);
  const [contentFile, setContentFile] = useState(null);
  const [brand, setBrand]   = useState(null);
  const [content, setContent] = useState(null);
  const [generatedHtml, setGeneratedHtml] = useState(null);
  const [error, setError]   = useState(null);
  const [loadStep, setLoadStep] = useState(0);

  const loadingSteps = [
    { label: 'Analyzing brand identity…' },
    { label: 'Extracting document content…' },
    { label: 'Generating branded document…' },
  ];

  const toB64 = f => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(f);
  });

  const uploadFile = async (file, endpoint) => {
    const fd = new FormData();
    fd.append('pdf', file);
    const res = await fetch(endpoint, { method: 'POST', body: fd });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: res.statusText }));
      throw new Error(err.error || 'Request failed');
    }
    return res.json();
  };

  const run = async () => {
    if (!brandFile || !contentFile) return;
    setError(null);
    setPhase('loading');
    setLoadStep(0);

    try {
      // Step 1: Extract brand
      const brandData = await uploadFile(brandFile, '/api/extract-brand');
      setBrand(brandData);
      setLoadStep(1);

      // Step 2: Extract content
      const contentData = await uploadFile(contentFile, '/api/extract-content');
      setContent(contentData);
      setLoadStep(2);

      // Step 3: Generate
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ brand: brandData, content: contentData })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: res.statusText }));
        throw new Error(err.error || 'Generation failed');
      }
      const { html } = await res.json();
      setGeneratedHtml(html);
      setPhase('result');
    } catch (err) {
      console.error(err);
      setError(err.message);
      setPhase('upload');
    }
  };

  const reset = () => {
    setPhase('upload');
    setBrandFile(null);
    setContentFile(null);
    setBrand(null);
    setContent(null);
    setGeneratedHtml(null);
    setError(null);
    setLoadStep(0);
  };

  const printDoc = () => {
    const w = window.open('', '_blank');
    w.document.write(generatedHtml);
    w.document.close();
    w.focus();
    setTimeout(() => w.print(), 500);
  };

  const downloadHtml = () => {
    const blob = new Blob([generatedHtml], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${brand?.companyName?.replace(/\s+/g, '_') || 'document'}_branded.html`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const stepIndex = phase === 'upload' ? 0 : phase === 'loading' ? 1 : 2;

  return e('div', null,
    // Hero
    e('div', { className: 'hero' },
      e('div', { className: 'hero-eyebrow' },
        e('span', null, '✦'),
        'Universal Document Rebrander'
      ),
      e('h1', null,
        'Any PDF. ',
        e('span', null, 'Any Brand.'),
        e('br'),
        'Instantly.'
      ),
      e('p', null, 'Upload your company profile + any source document. AI reads your brand identity and regenerates the content in your style.')
    ),

    // Steps bar
    e(StepsBar, { current: stepIndex }),

    // ── UPLOAD PHASE ──
    phase === 'upload' && e('div', { className: 'flow' },

      // Card 1: Brand PDF
      e('div', { className: 'card' },
        e('div', { className: 'card-header' },
          e('div', { className: 'card-icon blue' }, '🏢'),
          e('div', null,
            e('div', { className: 'card-title' }, 'Company Profile'),
            e('div', { className: 'card-sub' }, 'Your brand PDF — company brochure, profile, or any branded document')
          )
        ),
        e('div', { className: 'card-body' },
          e(UploadZone, {
            label: 'Drop your company profile PDF',
            hint: 'The AI will extract your colors, fonts, tone, and contact info',
            onFile: setBrandFile,
            file: brandFile
          })
        )
      ),

      // Card 2: Content PDF
      e('div', { className: 'card' },
        e('div', { className: 'card-header' },
          e('div', { className: 'card-icon green' }, '📋'),
          e('div', null,
            e('div', { className: 'card-title' }, 'Source Document'),
            e('div', { className: 'card-sub' }, 'Any PDF — competitor sheet, product catalog, menu, price list, spec sheet…')
          )
        ),
        e('div', { className: 'card-body' },
          e(UploadZone, {
            label: 'Drop any source PDF',
            hint: 'Content will be extracted and rebuilt in your brand style',
            onFile: setContentFile,
            file: contentFile
          })
        )
      ),

      error && e('div', { className: 'error-box' }, '⚠ ' + error),

      e('div', { className: 'action-row' },
        e('button', {
          className: 'btn btn-primary btn-lg',
          disabled: !brandFile || !contentFile,
          onClick: run
        }, '✦ Generate Branded Document')
      )
    ),

    // ── LOADING PHASE ──
    phase === 'loading' && e('div', { className: 'card' },
      e(LoadingView, { steps: loadingSteps, currentStep: loadStep })
    ),

    // ── RESULT PHASE ──
    phase === 'result' && generatedHtml && e('div', { className: 'flow' },

      e('div', { className: 'card' },
        e('div', { className: 'preview-toolbar' },
          e('div', { className: 'preview-info' },
            brand && e('span', null,
              e('strong', null, brand.companyName || 'Your Company'),
              ` · ${content?.documentType || 'Document'} · ${content?.title || ''}`
            )
          ),
          e('div', { style: { display: 'flex', gap: 8 } },
            e('button', { className: 'btn btn-ghost', onClick: reset }, '← Start Over'),
            e('button', { className: 'btn btn-ghost', onClick: downloadHtml }, '⬇ Download HTML'),
            e('button', { className: 'btn btn-success', onClick: printDoc }, '🖨 Print / Save PDF')
          )
        ),
        e('iframe', {
          className: 'preview-frame',
          srcDoc: generatedHtml,
          title: 'Generated Document',
          sandbox: 'allow-same-origin'
        })
      ),

      // Brand summary
      brand && e('div', { className: 'card', style: { marginTop: 16 } },
        e('div', { className: 'card-header' },
          e('div', { className: 'card-icon purple' }, '🎨'),
          e('div', null,
            e('div', { className: 'card-title' }, 'Detected Brand Identity'),
            e('div', { className: 'card-sub' }, 'Extracted from your company profile')
          )
        ),
        e('div', { className: 'card-body' },
          e(BrandPreview, { brand })
        )
      )
    )
  );
}

ReactDOM.render(e(App), document.getElementById('root'));
</script>

</body>
</html>
